wandb_project: video-motion-graphs
exp_name: inference
wandb_log_dir: outputs/wandb
output_dir: outputs/diffusion
seed: 42
base_model_path: weights/stable-diffusion-v1-5
vae_model_path: weights/sd-vae-ft-mse
image_encoder_path: weights/image_encoder
mm_path: weights/animatediff/mm_sd_v15_v2.ckpt
stage1_ckpt_step: '8000'
stage1_ckpt_dir: weights/finetune_weighted
data:
  meta_paths:
  - cache/Sequence_01_6/inference.json
  image_size: 512
  sample_frames: 14
  seed_frames: 3
  generated_frames: 8
validation:
  guidance_scale: 3.5
  denoising_steps: 20
solver:
  gradient_accumulation_steps: 1
  mixed_precision: fp16
  enable_xformers_memory_efficient_attention: true
noise_scheduler_kwargs:
  num_train_timesteps: 1000
  beta_start: 0.00085
  beta_end: 0.012
  beta_schedule: linear
  steps_offset: 1
  clip_sample: false
unet_additional_kwargs:
  use_inflated_groupnorm: true
  unet_use_cross_frame_attention: false
  unet_use_temporal_attention: false
  use_motion_module: true
  motion_module_resolutions:
  - 1
  - 2
  - 4
  - 8
  motion_module_mid_block: true
  motion_module_decoder_only: false
  motion_module_type: Vanilla
  motion_module_kwargs:
    num_attention_heads: 8
    num_transformer_block: 1
    attention_block_types:
    - Temporal_Self
    - Temporal_Self
    temporal_position_encoding: true
    temporal_position_encoding_max_len: 32
    temporal_attention_dim_div: 1
enable_zero_snr: true
