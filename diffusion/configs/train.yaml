base_model_path: weights/stable-diffusion-v1-5
data:
  aug_type: RandomResizeCrop
  generated_frames: 8
  image_size: 512
  meta_paths:
  - cache/Sequence_01_6/train.json
  sample_frames: 14
  sample_rate: 1
  seed_frames: 3
  train_bs: 1
enable_zero_snr: true
exp_name: train
guidance_encoder_kwargs:
  block_out_channels:
  - 16
  - 32
  - 96
  - 256
  guidance_embedding_channels: 320
  guidance_input_channels: 3
image_encoder_path: weights/image_encoder
mm_path: weights/animatediff/mm_sd_v15_v2.ckpt
noise_offset: 0.05
noise_scheduler_kwargs:
  beta_end: 0.012
  beta_schedule: linear
  beta_start: 0.00085
  clip_sample: false
  num_train_timesteps: 1000
  steps_offset: 1
output_dir: outputs/diffusion
pose_guider_pretrain: false
resume_from_checkpoint: ''
seed: 42
snr_gamma: 5.0
solver:
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-08
  adam_weight_decay: 0.01
  enable_xformers_memory_efficient_attention: true
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  learning_rate: 1.0e-05
  lr_scheduler: constant
  lr_warmup_steps: 1
  max_grad_norm: 1.0
  max_train_steps: 2
  mixed_precision: fp16
  scale_lr: false
  use_8bit_adam: true
stage1_ckpt_dir: weights/finetune_weighted
stage1_ckpt_step: '8000'
uncond_ratio: 0.1
unet_additional_kwargs:
  motion_module_decoder_only: false
  motion_module_kwargs:
    attention_block_types:
    - Temporal_Self
    - Temporal_Self
    num_attention_heads: 8
    num_transformer_block: 1
    temporal_attention_dim_div: 1
    temporal_position_encoding: true
    temporal_position_encoding_max_len: 32
  motion_module_mid_block: true
  motion_module_resolutions:
  - 1
  - 2
  - 4
  - 8
  motion_module_type: Vanilla
  unet_use_cross_frame_attention: false
  unet_use_temporal_attention: false
  use_inflated_groupnorm: true
  use_motion_module: true
vae_model_path: weights/sd-vae-ft-mse
validation:
  denoising_steps: 20
  guidance_scale: 3.5
  val_loss_steps: 2
  validation_steps: 2
wandb_log_dir: outputs/wandb
wandb_project: video-motion-graphs
weight_dtype: fp16
